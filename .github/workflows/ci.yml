name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_evaluation:
        description: Run the bounded F006 Groq evaluation after the MCP diagnostic
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check MCP imports
        run: python -c "import hr_mcp.client, hr_mcp.server"

      - name: Check Feature 003 import
        run: python -c "import hr_agent"

      - name: Run Streamlit AppTest startup
        run: python -m pytest tests/test_chat_interface.py -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run Feature 003 MCP integration
        run: python -m pytest -q tests/integration/test_agent_mcp.py
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run pytest
        run: python -m pytest -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

  live-evaluation:
    name: F006 live evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_evaluation == true && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare evaluation artifact directory
        run: mkdir -p "$RUNNER_TEMP/f006-evaluation"

      - name: Verify and record workflow revision
        run: |
          actual_revision="$(git rev-parse HEAD)"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/f006-evaluation/github-sha.txt"
          printf '%s\n' "$actual_revision" > "$RUNNER_TEMP/f006-evaluation/checked-out-sha.txt"
          test "$actual_revision" = "$GITHUB_SHA"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate evaluation cases
        run: python evaluation/run_evaluation.py --validate-only

      - name: Run one MCP-backed diagnostic case
        id: mcp_diagnostic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --diagnostic --output-dir "$RUNNER_TEMP/f006-evaluation" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/diagnostic.log"

      - name: Run bounded 20-case evaluation
        if: ${{ success() && steps.mcp_diagnostic.outcome == 'success' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --live --output-dir "$RUNNER_TEMP/f006-evaluation" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/evaluation.log"

      - name: Upload F006 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f006-evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/f006-evaluation/
          if-no-files-found: warn
          retention-days: 14