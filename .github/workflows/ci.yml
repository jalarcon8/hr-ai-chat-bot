name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_evaluation:
        description: Run the bounded F006 Groq evaluation after the MCP diagnostic
        required: true
        type: boolean
        default: false
      diagnostic_only:
        description: Stop after the diagnostic case for review
        required: true
        type: boolean
        default: true
      diagnostic_case:
        description: Evaluation case ID for the isolated MCP-backed diagnostic
        required: true
        type: string
        default: EVAL-001
      continue_remaining:
        description: Run only EVAL-004-020 once, skipping the prior diagnostic
        required: true
        type: boolean
        default: false
      coverage_unattempted:
        description: Run only the thirteen untouched cases once after explicit approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check MCP imports
        run: python -c "import hr_mcp.client, hr_mcp.server"

      - name: Check Feature 003 import
        run: python -c "import hr_agent"

      - name: Run Streamlit AppTest startup
        run: python -m pytest tests/test_chat_interface.py -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run Feature 003 MCP integration
        run: python -m pytest -q tests/integration/test_agent_mcp.py
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run pytest
        run: python -m pytest -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

  live-evaluation:
    name: F006 live evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_evaluation == true && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.coverage_unattempted && 15 || 45 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare evaluation artifact directory
        run: mkdir -p "$RUNNER_TEMP/f006-evaluation"

      - name: Verify and record workflow revision
        run: |
          actual_revision="$(git rev-parse HEAD)"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/f006-evaluation/github-sha.txt"
          printf '%s\n' "$actual_revision" > "$RUNNER_TEMP/f006-evaluation/checked-out-sha.txt"
          test "$actual_revision" = "$GITHUB_SHA"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate evaluation cases
        env:
          F006_CONTINUE_REMAINING: ${{ inputs.continue_remaining }}
          F006_DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          F006_COVERAGE_UNATTEMPTED: ${{ inputs.coverage_unattempted }}
        run: |
          python evaluation/run_evaluation.py --validate-only
          if [ "$F006_CONTINUE_REMAINING" = "true" ]; then
            test "$F006_DIAGNOSTIC_ONLY" = "false"
            test "$F006_COVERAGE_UNATTEMPTED" = "false"
          fi
          if [ "$F006_COVERAGE_UNATTEMPTED" = "true" ]; then
            test "$F006_DIAGNOSTIC_ONLY" = "false"
            test "$F006_CONTINUE_REMAINING" = "false"
          fi

      - name: Run one MCP-backed diagnostic case
        id: mcp_diagnostic
        if: ${{ !inputs.continue_remaining && !inputs.coverage_unattempted }}
        env:
          F006_DIAGNOSTIC_CASE: ${{ inputs.diagnostic_case }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGENT_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/agent-traces.jsonl
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --diagnostic --diagnostic-case "$F006_DIAGNOSTIC_CASE" \
            --output-dir "$RUNNER_TEMP/f006-evaluation" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/diagnostic.log"

      - name: Run bounded 20-case evaluation
        if: ${{ success() && !inputs.continue_remaining && !inputs.coverage_unattempted && steps.mcp_diagnostic.outcome == 'success' && !inputs.diagnostic_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGENT_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/agent-traces.jsonl
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --live --output-dir "$RUNNER_TEMP/f006-evaluation" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/evaluation.log"

      - name: Run bounded EVAL-004-020 continuation
        if: ${{ success() && inputs.continue_remaining && !inputs.coverage_unattempted && !inputs.diagnostic_only }}
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGENT_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/agent-traces.jsonl
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --continue-remaining \
            --output-dir "$RUNNER_TEMP/f006-evaluation" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/continuation.log"

      - name: Run coverage-first thirteen-case evaluation
        if: ${{ success() && inputs.coverage_unattempted && !inputs.continue_remaining && !inputs.diagnostic_only }}
        timeout-minutes: 10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGENT_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/coverage-${{ github.run_id }}-${{ github.run_attempt }}/agent-traces.jsonl
          HR_MCP_TRACE_PATH: ${{ runner.temp }}/f006-evaluation/coverage-${{ github.run_id }}-${{ github.run_attempt }}/mcp-traces.jsonl
        run: |
          set -o pipefail
          python evaluation/run_evaluation.py --cover-unattempted \
            --output-dir "$RUNNER_TEMP/f006-evaluation/coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 \
            | tee "$RUNNER_TEMP/f006-evaluation/coverage.log"

      - name: Upload F006 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.coverage_unattempted && format('f006-coverage-{0}-{1}-{2}', github.run_id, github.run_attempt, github.sha) || format('f006-evaluation-{0}', github.sha) }}
          path: ${{ runner.temp }}/f006-evaluation/
          if-no-files-found: warn
          retention-days: 14