name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check MCP imports
        run: python -c "import hr_mcp.client, hr_mcp.server"

      - name: Check Feature 003 import
        run: python -c "import hr_agent"

      - name: Run Streamlit AppTest startup
        run: python -m pytest tests/test_chat_interface.py -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run Feature 003 MCP integration
        run: python -m pytest -q tests/integration/test_agent_mcp.py
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"

      - name: Run pytest
        run: python -m pytest -q
        env:
          AGENT_RUN_PROVIDER_SMOKE: "0"